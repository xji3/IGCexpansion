[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "IGCexpansion"
version = "0.4.dev0"
description = "Interlocus gene conversion models (IS-IGC, PS-IGC) on gene-duplication trees"
authors = [{ name = "Xiang Ji" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "biopython",
    "networkx",
    "numpy",
    "scipy",
    "numdifftools",
    "jsonctmctree @ git+https://github.com/xji3/jsonctmctree.git@d9d26cc7cbf3bff7c19035c9c9154d92c551da86",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# GPU backend of the PS-IGC pair-site engine (IGCexpansion.psigc.gpu). It replays CUDA graphs for speed and falls
# back to slower eager execution if capture fails; tests/psigc/test_gpu.py::test_graph_capture checks capture.
gpu = ["torch>=2.11"]

[project.urls]
Homepage = "https://github.com/xji3/IGCexpansion"

[tool.setuptools]
packages = ["IGCexpansion", "IGCexpansion.beagle", "IGCexpansion.psigc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow cases (3721-state YGL062W, full PS-IGC objectives) run with: pytest -m slow  (or -m "" for all)
addopts = "-m 'not slow'"
markers = [
    "slow: long-running cases (3721-state MG94, full PS-IGC objectives); run with -m slow",
    "external: needs data outside this repository (IGCTract/MafftAlignment)",
]
